<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="map.css">

    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="map">
            <div>
                <img class="island" src="../image/island.png">
            </div>

            <div class="cloud">
                <img class="cloud_top" src="../image/cloud_bottom.png">
                <img class="cloud_bottom" src="../image/cloud_bottom.png">
            </div>

            <div class="waterfall">
                <img id="waterfall" src="../image/waterfall/1.png" alt="Changing image" />
            </div>

            <div class="level">
                <button class="button" style="margin-top: 15%; margin-left: 64%">1</button>
                <button class="button" style="margin-top: 11%; margin-left: 54%">2</button>
                <button class="button" style="margin-top: 19%; margin-left: 48%">3</button>
                <button class="button" style="margin-top: 19%; margin-left: 42%">4</button>
                <button class="button" style="margin-top: 11%; margin-left: 41%">5</button>
                <button class="button" style="margin-top: 12%; margin-left: 33%">6</button>
                <button class="button" style="margin-top: 14%; margin-left: 28%">7</button>
                <button class="button" style="margin-top: 19%; margin-left: 32%">8</button>
            </div>
        </div>
        <div class="chat">
            <div class="cloud-container">
                <div class="cloudText" id="cloudText">
                    <p id="text">Welcome to the YZU GO!</p>
                </div>
            </div>
            <div class="dolphin">
                <img src="../image/dolphin.png">
            </div>

        </div>
    </div>


    <script src="map.js"></script>
</body>

</html>
