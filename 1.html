<!DOCTYPE html>
<html>
<head>
<style>
.talk-cloud {
  width: 220px;
  height: 90px;
  background: white;
  border-radius: 50px;
  position: relative;
  box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

/* Cloud bumps */
.talk-cloud::before,
.talk-cloud::after {
  content: "";
  position: absolute;
  background: white;
  border-radius: 50%;
}
.talk-cloud::before {
  width: 100px;
  height: 100px;
  left: -20px;
  top: -40px;
}
.talk-cloud::after {
  width: 100px;
  height: 100px;
  right: -20px;
  top: -40px;
}

/* Speech tail */
.talk-cloud .tail {
  width: 35px;
  height: 35px;
  background: white;
  border-radius: 50%;
  position: absolute;
  bottom: -10px;
  left: 40px;
  box-shadow: 0 0 5px rgba(0,0,0,0.2);
}
</style>
</head>
<body>

<div class="talk-cloud">
  <div class="tail"></div>
</div>

</body>
</html>
